<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fridge Health Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
        <h2 style="font-weight: 800; letter-spacing: -1.5px; margin-bottom: 0; color: #fff; text-transform: uppercase;">
            THERMO <span style="color: var(--accent-green); text-shadow: 0 0 12px rgba(0, 255, 136, 0.4);">TRACK</span>
        </h2>
        <div style="font-size: 0.65rem; color: #8b949e; letter-spacing: 1.2px; font-weight: 500;">INDUSTRIAL MONITORING SYSTEM V1.0</div>
    </div>
        <div>
            <button onclick="clearDatabase()" class="btn btn-outline-danger btn-sm me-2">Clear History</button>
            <div id="connection-status" class="badge bg-success">Connected</div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="label">Temperature</div>
                <div id="temp-val" class="value">--</div>
                <div class="small text-muted">Range: 2°C - 8°C</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="label">Current Draw</div>
                <div id="curr-val" class="value">--</div>
                <div class="small text-muted">Amps (A)</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stat-card">
                <div class="label">System Status</div>
                <div id="status-text" class="value" style="font-size: 1.8rem;">WAITING...</div>
                <div class="mt-3 pt-2 border-top border-secondary">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="small text-muted">Unit Consumed:</span>
                        <span style="color: #00d4ff; font-weight: bold;"><span id="power-val">0</span> Wh</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="small text-muted">Health Score:</span>
                        <span id="health-val" style="color: #ffcc00; font-weight: bold;">100%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-6"><div class="chart-wrapper"><canvas id="tempChart"></canvas></div></div>
        <div class="col-md-6"><div class="chart-wrapper"><canvas id="currChart"></canvas></div></div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div class="chart-wrapper">
            <div class="label mb-3">Recent Event Log</div>
            <div class="log-scroll"> <table class="table table-dark table-hover mb-0">
                    <thead>
                        <tr><th>Timestamp</th><th>Event / Status</th></tr>
                    </thead>
                    <tbody id="event-log-body"></tbody>
                </table>
            </div> </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
